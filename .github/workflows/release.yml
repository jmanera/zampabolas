# Compila el APK firmado y lo publica como release. Solo se lanza a mano (Actions > Publicar APK > Run workflow)
# y solo lo puede ejecutar el dueño del repositorio.
name: Publicar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Compilar y publicar
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Sin la clave de siempre, la app no se podría actualizar en la tablet sin desinstalarla
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Falta el secreto KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Compilar
        run: ./build.sh

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.${{ github.run_number }}"
          gh release create "$tag" Zampabolas.apk --title "Zampabolas $tag" --latest \
            --notes "APK firmado, compilado desde ${GITHUB_SHA::7}. Se instala abriéndolo en la tablet o con \`adb install -r Zampabolas.apk\`."
