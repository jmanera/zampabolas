<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zampabolas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="btn icon" id="bMenu" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <h1>Zampabolas</h1>
    <div class="stats">
      <div class="stat"><b id="sScore">0</b><span>Puntos</span></div>
      <div class="stat"><b id="sBest">0</b><span>Récord</span></div>
      <div class="stat"><b id="sLevel">1</b><span>Nivel</span></div>
    </div>
    <div id="lives"></div>
    <button class="btn icon" id="bPause" aria-label="Pausa"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  </header>
  <div id="main">
    <div id="stage"><canvas id="cv"></canvas></div>
    <aside id="side">
      <div id="pad">
        <button data-d="up" aria-label="Arriba"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
        <button data-d="left" aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
        <button data-d="right" aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
        <button data-d="down" aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </aside>
  </div>
</div>
<div id="modal"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script src="laberintos.js"></script>
<script src="mundos/clasico.js"></script>
<script src="mundos/navidad.js"></script>
<script src="mundos/bosque.js"></script>
<script src="mundos/carreras.js"></script>
<script src="motor.js"></script>
<script src="dibujo.js"></script>
<script src="app.js"></script>
</body>
</html>
